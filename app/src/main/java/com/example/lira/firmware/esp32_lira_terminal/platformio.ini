; ==============================================================================
; LIRA — Physical Review Terminal PlatformIO Configuration
; ESP32 DevKit V1 + ILI9341 TFT + RC522 RFID + 5-Button Console + Buzzer
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TFT_eSPI @ ^2.5.43
    miguelbalboa/MFRC522 @ ^1.4.11

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=27
    -D TFT_DC=26
    -D TFT_RST=25
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
